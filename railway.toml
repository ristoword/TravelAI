# Railway deploy config for TravelAI (linked GitHub main → production)
# Do not run `railway init` again if a project is already linked.

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
# Migrate against private DATABASE_URL, then start (private networking available at runtime).
# Railway injects PORT; bind all interfaces for the public proxy.
startCommand = "npx prisma migrate deploy && npx next start -H 0.0.0.0 -p ${PORT:-3000}"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
